env:
  FLB_LOG_FILE: ljj;lkh;
  STORAGE_PATH: asdfasgaf
  LOG_PATH: agqwfadfa
  DB_PATH: qwerfagfa
  TAG: qrwgqsfasf
  LOKI_HOST: asdgasf
  TENANT_ID: qwefasdgva
  TLS_CA_FILE: fqwefadsgfas
  TLS_CRT_FILE: fqfasdfag
  TLS_KEY_FILE: qfasdgfasdf

service:
  log_file: ${FLB_LOG_FILE}
  log_level: error
  scheduler.base: 5
  scheduler.cap: 300
  storage.path: ${STORAGE_PATH}
  storage.checksum: on
  storage.delete_irrecoverable_chunks: on

parsers:
  - name: parser_app
    format: regex
    regex: ^\[(?<timestamp>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\]\s+(?<level>[A-Z]+)\s+(?<message>.*)$
    time_key: timestamp
    time_format: '%Y-%m-%d %H:%M:%S'
    time_keep: off

multiline_parsers:
  - name: multi_app
    type: regex
    flush_timeout: 1000
    rules:
      - state: start_state
        regex: /^\[\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/
        next_state: cont
      - state: cont
        regex: /^(?!\[\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}).*/
        next_state: cont

pipeline:
  inputs:
    - name: tail
      tag: ${TAG}
      path: ${LOG_PATH}
      path_key: filename
      db: ${DB_PATH}
      multiline.parser: multi_app
      skip_empty_lines: on
      refresh_interval: 5
      storage.type: filesystem
      threaded: on

  filters:
    - name: parser
      match: app
      key_name: log
      parser: parser_app
      reserve_data: on

  outputs:
    - name: loki
      match: ${TAG}
      host: ${LOKI_HOST}
      port: 443
      tenant_id: ${TENANT_ID}
      labels: filename=$filename, instance=${HOSTNAME}
      tls: on
      tls.ca_file: ${TLS_CA_FILE}
      tls.crt_file: ${TLS_CRT_FILE}
      tls.key_file: ${TLS_KEY_FILE}
      retry_limit: no_limits
      storage.total_limit_size: 1G
      net.connect_timeout: 310
      net.keepalive_idle_timeout: 30
      net.dns.resolver: ASYNC
      workers: 2
