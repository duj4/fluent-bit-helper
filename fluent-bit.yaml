env:
  FLB_LOG_FILE: /d/d1/app/fluent-bit/log/fluent-bit.log
  STORAGE_PATH: /d/d1/app/fluent-bit/data/storage
  LOG_PATH: test.log
  DB_PATH: /d/d1/app/fluent-bit/data/database
  TAG: app

service:
  log_file: ${FLB_LOG_FILE}
  log_level: error
  scheduler.base: 5
  scheduler.cap: 300
  storage.path: ${STORAGE_PATH}
  storage.sync: full
  storage.delete_irrecoverable_chunks: on

pipeline:
  inputs:
    - name: tail
      tag: ${TAG}
      path: ${LOG_PATH}
      path_key: filename
      db: ${DB_PATH}
      skip_empty_lines: on
      refresh_interval: 5
      storage.type: filesystem
      threaded: on

  outputs:
    - name: stdout
      match: ${TAG}
